<header class="header">
  <div class="header-left">
    <h1 class="page-title">{{ pageTitle() }}</h1>
    @if (pageSubtitle()) {
      <span class="page-subtitle">{{ pageSubtitle() }}</span>
    }
  </div>

  <div class="header-right">
    <div class="sync-status" title="System synced">
      <div class="sync-dot"></div>
      <span class="sync-text">Synced</span>
    </div>

    <div class="user-menu">
      <button class="user-btn" (click)="toggleDropdown()">
        <span class="user-name">{{ authService.currentUser()?.display_name || 'User' }}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      @if (isDropdownOpen()) {
        <div class="dropdown-menu">
          <div class="dropdown-header">
            <div class="name">{{ authService.currentUser()?.display_name || 'User' }}</div>
            <div class="role">{{ authService.currentUser()?.role || 'Admin' }}</div>
          </div>
          <div class="divider"></div>
          <button class="dropdown-item" (click)="changePassword()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Change Password
          </button>
          <button class="dropdown-item danger" (click)="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            Logout
          </button>
        </div>
      }
    </div>
  </div>
</header>
