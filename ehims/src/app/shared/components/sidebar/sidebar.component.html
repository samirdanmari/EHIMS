<div class="sidebar" [class.collapsed]="isCollapsed()">
  <div class="brand">
    <div class="brand-logo" title="EHIMS">
      EH
    </div>
    @if (!isCollapsed()) {
      <div class="brand-text">EHIMS</div>
    }
  </div>

  <nav class="nav-menu">
    @for (item of filteredNavItems(); track item.route) {
      <a [routerLink]="item.route" 
         routerLinkActive="active" 
         class="nav-item"
         [title]="isCollapsed() ? item.label : ''">
        <div class="icon-wrapper">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path [attr.d]="item.icon"></path>
          </svg>
        </div>
        @if (!isCollapsed()) {
          <span class="nav-label">{{ item.label }}</span>
        }
      </a>
    }
  </nav>

  <div class="user-section">
    <div class="user-profile">
      <div class="avatar">{{ initials }}</div>
      @if (!isCollapsed()) {
        <div class="user-info">
          <div class="name">{{ authService.currentUser()?.display_name || 'System User' }}</div>
          <div class="role-badge">{{ authService.currentUser()?.role || 'Admin' }}</div>
        </div>
      }
    </div>
    <button class="toggle-btn" (click)="toggleCollapse()" [attr.title]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        @if (isCollapsed()) {
          <polyline points="13 17 18 12 13 7"></polyline>
          <polyline points="6 17 11 12 6 7"></polyline>
        } @else {
          <polyline points="11 17 6 12 11 7"></polyline>
          <polyline points="18 17 13 12 18 7"></polyline>
        }
      </svg>
    </button>
  </div>
</div>
